# Builds and uploads the package to PyPI when a GitHub release is created.
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: Upload Python Package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Verify the package imports and tests pass
      run: |
        pip install -e ".[dev]"
        pytest tests/ -q

    - name: Build distributions
      # setup.py was removed in 0.0.78 in favour of pyproject.toml + hatchling,
      # so this must go through the PEP 517 frontend.
      run: python -m build

    - name: Check distribution metadata
      run: twine check dist/*

    - name: Publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: twine upload dist/*
