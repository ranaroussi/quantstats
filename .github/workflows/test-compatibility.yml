name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip

    - name: Install ruff
      run: pip install ruff

    - name: Lint
      run: ruff check quantstats tests

    - name: Check formatting
      run: ruff format --check quantstats tests
      continue-on-error: true

  test:
    name: Python ${{ matrix.python-version }} / pandas ${{ matrix.pandas-version }} / numpy ${{ matrix.numpy-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10 (pyproject.toml). The matrix covers
        # pandas 2.0/2.2 x numpy 1.26/2.1 plus a separate latest job; the
        # declared floors (pandas>=1.5.0, numpy>=1.24.0) are lower and are
        # not exercised here.
        python-version: ['3.10', '3.11', '3.12', '3.13']
        pandas-version: ['2.0.3', '2.2.3']
        numpy-version: ['1.26.4', '2.1.3']
        exclude:
          # pandas 2.0.x predates the numpy 2.x ABI and fails to import
          - pandas-version: '2.0.3'
            numpy-version: '2.1.3'
          # pandas 2.0.x has no wheels for Python 3.12+
          - python-version: '3.12'
            pandas-version: '2.0.3'
          - python-version: '3.13'
            pandas-version: '2.0.3'
          # numpy 1.26 has no wheels for Python 3.13
          - python-version: '3.13'
            numpy-version: '1.26.4'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install quantstats with pinned pandas and numpy
      run: |
        python -m pip install --upgrade pip
        # One resolve: the exact numpy/pandas pins are hard constraints while
        # the resolver picks compatible versions of everything else.
        pip install "numpy==${{ matrix.numpy-version }}" "pandas==${{ matrix.pandas-version }}" -e ".[dev]"

    - name: Print versions
      run: |
        python -c "import pandas, numpy; print(f'pandas {pandas.__version__} / numpy {numpy.__version__}')"

    - name: Run test suite
      run: pytest tests/ --durations=10

  test-latest:
    name: Latest pandas/numpy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip

    - name: Install latest dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade pandas numpy -e ".[dev]"

    - name: Print versions
      run: |
        python -c "import pandas, numpy; print(f'pandas {pandas.__version__} / numpy {numpy.__version__}')"

    - name: Run test suite
      run: pytest tests/ --durations=10
